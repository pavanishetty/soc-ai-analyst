name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test with coverage
        run: pytest -v --cov --cov-report=xml

      - name: Save coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  secrets-scan:
    name: Secrets scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install pip-audit
        run: pip install "$(grep '^pip-audit==' requirements-dev.txt)"

      - name: Audit dependencies
        run: pip-audit -r requirements.txt --no-deps --disable-pip --desc

  dockerfile-lint:
    name: Dockerfile lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

  container-scan:
    name: Container build and scan (Trivy)
    needs: [test, dockerfile-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build image
        run: |
          for attempt in 1 2 3; do
            docker build -t "soc-ai-analyst:${GITHUB_SHA}" . && exit 0
            echo "Build attempt ${attempt} failed; retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done
          exit 1

      - name: Smoke test the container
        run: |
          docker run -d --name app -p 8000:8000 "soc-ai-analyst:${GITHUB_SHA}"
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo " - container is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Container failed to become healthy"
          docker logs app
          exit 1

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: soc-ai-analyst:${{ github.sha }}
          version: v0.70.0
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Save the scanned image
        run: docker save "soc-ai-analyst:${GITHUB_SHA}" | gzip > image.tar.gz

      - name: Upload the scanned image
        uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: image.tar.gz
          retention-days: 1

  dast:
    name: DAST (OWASP ZAP)
    needs: container-scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download the scanned image
        uses: actions/download-artifact@v4
        with:
          name: container-image

      - name: Start the scanned image
        run: |
          gunzip -c image.tar.gz | docker load
          docker run -d --name app -p 8000:8000 "soc-ai-analyst:${GITHUB_SHA}"
          for i in $(seq 1 15); do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          docker logs app
          exit 1

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:8000/health
          rules_file_name: .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-report

  sonarqube:
    name: SonarQube analysis
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5

      - name: Check formatting
        run: terraform fmt -check -recursive infra

      - name: Validate bootstrap layer
        run: |
          terraform -chdir=infra/bootstrap init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/bootstrap validate

      - name: Validate app layer
        run: |
          terraform -chdir=infra/app init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/app validate

  iac-scan:
    name: IaC scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install checkov==3.3.22

      - name: Scan Terraform
        run: checkov -d infra --framework terraform --compact --quiet

  deploy:
    name: Deploy to AWS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [secrets-scan, dependency-audit, dast, sonarqube, terraform-validate, iac-scan]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    outputs:
      function_url: ${{ steps.apply.outputs.function_url }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download the scanned image
        uses: actions/download-artifact@v4
        with:
          name: container-image

      - name: Load the scanned image
        run: gunzip -c image.tar.gz | docker load

      - name: Debug - show OIDC token claims (temporary)
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          PAYLOAD=$(echo "${TOKEN}" | cut -d. -f2)
          python3 -c "import base64,json,sys;p=sys.argv[1];p+='='*(-len(p)%4);c=json.loads(base64.urlsafe_b64decode(p));print(json.dumps({k:c.get(k) for k in ['sub','aud','repository','environment','ref']},indent=2))" "${PAYLOAD}"        

      - name: Log in to AWS with OIDC (no stored keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-deploy-${{ github.run_id }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Push the scanned image to ECR
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="${REGISTRY}/soc-ai-analyst:${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
          docker tag "soc-ai-analyst:${GITHUB_SHA}" "${IMAGE}"
          docker push "${IMAGE}"
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}" | cut -d@ -f2)
          echo "Pushed ${IMAGE} with digest ${DIGEST}"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra/app
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=app/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Terraform apply
        id: apply
        working-directory: infra/app
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          terraform apply -input=false -auto-approve -var "image_digest=${IMAGE_DIGEST}"
          echo "function_url=$(terraform output -raw function_url)" >> "${GITHUB_OUTPUT}"

      - name: Smoke test the live API
        env:
          FUNCTION_URL: ${{ steps.apply.outputs.function_url }}
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "${FUNCTION_URL}health"; then
              echo " - live API is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Live API failed its health check"
          exit 1

  dast-live:
    name: DAST on live API (OWASP ZAP)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: ZAP baseline scan of the live HTTPS endpoint
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ needs.deploy.outputs.function_url }}health
          rules_file_name: .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-report-live